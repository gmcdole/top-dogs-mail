name: Build Top Dogs Mail (Patriot Radio Club branded, Windows)

# Windows build. Run #1 (2026-08-22) failed at "Bootstrap build environment"
# after 32s: mach requires Mozilla's own MozillaBuild toolchain pre-installed
# at C:\mozilla-build before it will run at all on Windows - it does not
# install that piece itself. Fixed by adding the "Install MozillaBuild"
# step below (via Chocolatey, which windows-latest runners already have),
# installing silently to the default path mach expects.
#
# Run #2 failed on a missing thunderbird.VisualElementsManifest.xml (Windows
# Start-tile manifest) - fixed by adding it plus two PNGs to the branding
# folder, matching Mozilla's own stock layout.
#
# Runs #3 and #4 both cleared bootstrap/clone/vendor and got deep into the
# actual compile (2h20m in both times) before failing at the exact same
# target: toolkit/crashreporter/crash_helper_server/crash_helper_server.lib,
# with mozmake reporting "Error 2" and no compiler/linker text at all, even
# with mach build -v and even in the full untruncated raw log.
#
# Run #5 added full-output-to-file capture (mach-build-full.log, uploaded as
# an artifact) so the complete log could be searched directly rather than
# relying on GitHub's log viewer, which truncates very large steps. That run
# got further (past crash_helper_server) and failed later, at a DIFFERENT
# target (toolkit/crashreporter/mozwer-rust/mozwer_s.lib) with the exact same
# signature: the Rust crate itself finishes successfully ("Finished release
# profile...") and then mozmake immediately reports "Error 2" up the
# recurse.mk/rules.mk/client.mk chain with zero diagnostic text anywhere in
# the 24MB/49000-line full log - confirmed by exhaustive grep for every
# realistic error pattern (error C####, error[E####], fatal error, LINK
# fatal, lld-link error, undefined symbol, etc), all with zero matches.
#
# Run #6 added a "Report machine specs" step (confirmed this repo's public
# windows-latest runner really does get 4 vCPU / 16GB RAM, matching GitHub's
# documented spec) and a memory-monitor background job meant to sample free
# RAM every 10s during the build, to directly test the leading OOM
# hypothesis. Run #6 failed again with the identical silent-Error-2
# signature (back at crash_helper_server.lib this time), but the memory
# monitor itself produced NO data at all - it was implemented as two
# separate steps ("Start memory monitor" / "Stop memory monitor and show
# summary"), and PowerShell's Start-Job creates its background job as a
# child process of the CURRENT STEP's shell. GitHub Actions runners have a
# documented process-cleanup mechanism (confirmed via a primary source -
# github.com/actions/runner issue #598, "Disable process cleanup" - which
# describes the runner terminating child/background processes once a step
# completes) that killed the job before it ever wrote a single sample. This
# was a bug in the diagnostic's own implementation, not evidence about the
# build - it means run #6 could not actually confirm or rule out OOM.
#
# Run #7 fixed the monitor (merged it into the same step as the build so it
# survives the step-boundary process cleanup) and this time it actually
# worked: 908 samples covering the full ~2.5 hour build. Free memory stayed
# between 8.2GB and 12.4GB free out of 16.4GB total for the ENTIRE build,
# never remotely close to exhaustion. This DIRECTLY RULES OUT OOM as the
# cause - confirmed with real measurement, not assumption. Run #7 failed
# with the identical silent-Error-2 signature yet again (mozwer_s.lib this
# time), confirmed via the same exhaustive grep with zero matches.
#
# With OOM ruled out, antivirus/Defender interference was checked next -
# also ruled out via a primary source: GitHub's own actions/runner-images
# repo (Configure-WindowsDefender.ps1, the script that provisions every
# windows-latest image) sets DisableRealtimeMonitoring = $true and disables
# behavior monitoring, script scanning, network file scanning, intrusion
# prevention, and controlled folder access by default on every windows-latest
# runner - real-time AV scanning is already off before our workflow even
# starts, so it cannot be interfering with the build.
#
# With both leading environment-level hypotheses ruled out by direct
# evidence, the actual failure pattern was re-examined: every failure so far
# shows the target's .lib line printed, then a bare ":" on its own line, then
# immediately "Error 2" - with the crashes happening during a "link storm"
# (dozens of lld-link.exe processes running within a ~48-second window) per
# run #5's findings. A bare partial line right before an unexplained failure
# is the classic signature of PARALLEL MAKE OUTPUT INTERLEAVING: when many
# recipes finish near-simultaneously, GNU Make (which mozmake is built from,
# confirmed patched from GNU Make 4.0 per Mozilla's own Bugzilla #927213)
# can interleave their stdout/stderr line-by-line, and a genuine error
# message from one job can end up scrambled into another job's output or
# effectively lost from readable view. GNU Make 4.0 added --output-sync
# specifically to solve this (confirmed via GNU Make's own manual and its
# 4.0 release notes): with --output-sync=target, each recipe's full output
# is buffered and printed as one uninterrupted block once that recipe
# finishes, instead of being interleaved with other parallel recipes' output.
# Mozilla's own Bugzilla #837846 confirms mach respects extra make flags
# passed via MOZ_MAKE_FLAGS in mozconfig (mk_add_options MOZ_MAKE_FLAGS=...),
# and that this reaches mozmake correctly on Windows.
#
# Run #8 added mk_add_options MOZ_MAKE_FLAGS="--output-sync=target" to
# mozconfig, and confirmed via the log (mozmake.exe -f client.mk
# --output-sync=target -j4) that the flag was genuinely active for the whole
# build. The identical silent Error 2 signature reproduced anyway (back at
# crash_helper_server.lib this run) - this DISPROVES the output-interleaving
# hypothesis, since output-sync buffers and prints each recipe's full output
# as one block once it finishes, so a real error message could not have been
# hidden by interleaving if one existed. Tracing the log further showed the
# failing target's own sub-make process never printed an error before the
# parent process reported Error 2 - the shape of an abrupt process death
# (crash or external kill), not a normal error being lost.
#
# With OOM, Defender, and output-interleaving all ruled out by direct
# evidence, the one variable never checked was whether windows-latest is
# even a stable target. It isn't: confirmed via GitHub's own
# actions/runner-images repo (issue #14017) that windows-latest migrated
# from Visual Studio 2022 to Visual Studio 2026 the week of June 8-15, 2026 -
# meaning every run so far (all in the last few days) has been building on
# a brand-new toolchain (Windows Server 2025 / VS2026 / MSVC toolset "18"),
# not the VS2022 stack most of the wider Firefox/Thunderbird build community
# has actually exercised. GitHub's own migration announcement tells anyone
# who needs the older, known toolchain to use the windows-2022 label
# instead. Real successful Thunderbird forks (e.g. Betterbird, confirmed via
# their own blog) build on a single fixed, deliberately-chosen machine, not
# an auto-updating "whatever is current" image - the opposite of what
# windows-latest gives us.
#
# Run #9's change: pin runs-on to windows-2022 instead of windows-latest, so
# the build runs on the toolchain the wider Firefox/Thunderbird ecosystem has
# actually been tested against. No other change. This is a direct,
# falsifiable test: if this run succeeds, or at least produces a real,
# different diagnostic instead of a silent Error 2, that confirms the VS2026
# migration as the root cause. If the identical silent signature still
# reproduces on windows-2022, this hypothesis is ruled out too, and Windows
# Event Log / WER crash capture (Get-WinEvent, Event ID 1000/1001) is the
# next diagnostic to add.
#
# Run #9 failed with the identical silent Error 2 signature (back at
# crash_helper_server.lib) - but the log revealed WHY the windows-2022 pin
# could never have worked, not just that it didn't: the actual MSVC compiler
# used for this build comes from C:\Users\runneradmin\.mozbuild\vs\VC\Tools\
# MSVC\14.51.36231\... - inside mach's own toolchain cache, not the runner
# image's system-installed Visual Studio. mach bootstrap vendors and pins
# its own MSVC (alongside the already-known vendored clang-cl), completely
# independent of whatever VS version ships on windows-latest vs windows-2022.
# The VS2026-migration hypothesis is disproven with a real mechanism, not
# just a failed retest - the variable we changed was never in the code path
# that compiles anything.
#
# With OOM, Defender, output-interleaving, and now the runner image all
# ruled out by direct evidence, and the failure's own shape (target line,
# bare ":", zero further output, immediate Error 2) looking like an abrupt
# process death from the start, the next diagnostic is Windows Error
# Reporting itself. Event ID 1000 ("Application Error") is written
# automatically to the Windows Application event log whenever any process
# crashes, with no configuration required (confirmed via Microsoft's own
# documentation) - it records the faulting module name, exception code
# (e.g. 0xc0000005, an access violation), and process ID, and is readable
# via Get-WinEvent without administrator rights.
#
# Run #10's change: capture the build's start time to a file, then after
# the build step (regardless of pass/fail), query the Application event log
# for Event ID 1000/1001 entries since that start time and both print and
# upload whatever is found. This does not change what gets built - it only
# adds a new place to look for the actual crash, if one is happening.
#
# Remaining known risk (see Top-Dogs-Mail-Project-Reference.md for detail):
# disk space - checked and currently fine (140GB+ free on the D: drive where
# the build lives, confirmed via the disk space steps below).

#
# Run 11 (2026-08-25): repo now carries everything proven manually on the
# dedicated build VM this session - branding.nsi, the 4 .ico + 3 NSIS wizard
# .bmp files, edition-qualified brand.dtd/ftl/properties, --disable-updater,
# and the full app-identity rename (MOZ_APP_NAME/BASENAME/VENDOR/ID plus the
# defines.nsi.in/installer.nsi strings) applied via a new step right after
# branding is copied in. MOZ_APP_PROFILE is deliberately left untouched (see
# Top-Dogs-Mail-Project-Reference.md, "CRITICAL product requirement" section)
# so this can replace an existing real Thunderbird install without losing
# accounts. This does NOT address the still-unexplained silent Error 2 crash
# from runs 3-10 above - that mystery was never root-caused, only left behind
# by moving the build to a dedicated VM. If it recurs here, it's unrelated to
# tonight's changes and needs its own fresh diagnosis.
#
# Run 12 (2026-08-25): packaging succeeded this run via the `mach package`
# fix from run 11's diagnosis. Sanity check of the uploaded installer
# artifact found it was actually the NSIS uninstaller (helper.exe,
# 1,070,115 bytes) - the "Locate packaged installer" step below was
# naively grabbing the first .exe found under dist, which happened to be
# the uninstaller, always built as a normal side effect of mach build and
# unrelated to packaging. Checked the actual "Package installer" step log
# directly and confirmed mach package did produce a genuine installer at
# obj-*/comm/mail/installer/windows/instgen/setup.exe - but only 756,943
# bytes (~739KB), dramatically smaller than the dedicated build VM's
# ~90MB installer from an identical mozconfig earlier the same night.
# Fixed the detection step (see "Run 12 diagnosis" comment below) to check
# known-good paths by exact name first, and to fail loudly with a full
# listing of every .exe actually found if none match, instead of silently
# uploading the wrong file again.
#
# Run 13 (2026-08-26): triggered to confirm the run 12 installer-detection
# fix. Result: the detection logic itself worked correctly - it found and
# uploaded the real instgen/setup.exe (756,943 bytes) as intended. But
# actually installing that artifact in Windows Sandbox revealed a much
# bigger problem: the installer only copies 2 helper DLLs (MapiProxy_InUse.dll,
# mozMapi32_InUse.dll) - no topdogsmail.exe, no core application resources
# at all. Confirmed via the sandbox's install.log and via run 13's own full
# build log that this is genuinely what mach package produced, not a
# wrong-file-detection issue. Root cause found in that build log: this
# branding folder's configure.sh had an UNQUOTED
# `MOZ_APP_DISPLAYNAME=Top Dogs Mail` line, which shell-parses as setting
# the variable to just "Top" (and attempting to run a nonexistent command
# "Dogs Mail") - explaining the "Top" truncation seen throughout the
# installer wizard (Setup Type page, Summary page, desktop/Start Menu
# shortcut names). Fixed to `MOZ_APP_DISPLAYNAME="PRC Mail"` (quoted, and
# updated to the subsidiary's own short name per the branding policy
# clarified the same day - see Top-Dogs-Mail-Project-Reference.md,
# "Product name policy clarified" section). Working hypothesis, not yet
# confirmed: the same broken line may also explain the empty installer
# payload above, since `mach package` is a separate mach invocation that
# likely re-reads this same file independently of `mach build`. Also
# replaced the wizWatermark.bmp wizard-sidebar eagle image (cropped in an
# earlier session) with a corrected version, fully visible on the approved
# Old Glory Blue background. Committed as 608c7e7. Run 14 is the test of
# whether this one fix resolves the naming bug, the empty-payload bug, and
# confirms the corrected eagle image, all at once.
#
# Run 14 (2026-08-27): built from commit 608c7e7 (via 270d52a). Checked directly
# against the "Package installer (mach package)" and "Locate packaged installer"
# step logs, not just the green checkmark. Result: the found installer was
# 757,041 bytes - 98 bytes different from run 13's 756,943 bytes, i.e.
# essentially the same tiny, broken installer. The MOZ_APP_DISPLAYNAME
# quoting fix did NOT fix the empty-payload bug - that hypothesis from the
# run 13 notes is disproven. The naming fix itself is still believed correct
# (the bug and mechanism were both directly confirmed from run 13's build
# log) but was not re-verified visually this run - no Windows Sandbox install
# test was done against run 14's installer, since it still can't launch
# anything either way.
#
# Real progress this time: read the *complete* "Package installer" step log
# (previously only partially visible via the GitHub UI's virtualized log
# view - pulled the full text via Actions' "Download log archive" instead).
# It shows something the earlier partial view never surfaced: right after
# the small instgen/setup.exe (757KB) NSIS compile, the same step runs UPX
# to compress a "7zSD.sfx" self-extracting stub, then runs 7-Zip and reports
# "11 folders, 58 files, 395509918 bytes (378 MiB)" scanned and archived into
# an app.7z at 89,764,678 bytes (~86 MiB) - i.e. mach package DOES build the
# full ~86MB application payload archive in this same step. Per Mozilla's own
# installer build docs (firefox-source-docs.mozilla.org, Windows installer
# build page): unless MOZ_STUB_INSTALLER is explicitly set, "only the full
# installer is built" - the small instgen/setup.exe is only the front-end
# NSIS shell, and the real full/complete installer is produced by
# concatenating the UPX-packed SFX module with the 7z payload into one file,
# normally expected at obj-*\dist\install\sea\*.exe. That is genuinely the
# FIRST pattern our own "Locate packaged installer" step already checks -
# but it comes up empty every run (Get-ChildItem finds nothing there), so
# the script falls through to the small instgen/setup.exe and uploads that
# instead. Because the script `break`s on the first pattern with any match,
# it never even checks the third pattern (obj-*\dist\*.exe), which may or
# may not hold the real combined installer under a name we haven't
# anticipated. Not yet confirmed where the ~86MB combined file actually
# lands, or whether it lands anywhere at all in this build configuration -
# the GitHub Actions runner that produced run 14 no longer exists to inspect
# directly, so run 15 needs to gather that evidence itself.
#
# Fix applied for run 15, evidence-gathering rather than a guessed fix: (1)
# the "Locate packaged installer" step now collects EVERY match across all
# three candidate patterns and picks the largest by byte size, instead of
# stopping at the first pattern with any match at all - this alone might
# surface a real combined installer if one exists under obj-*\dist\*.exe
# and was simply being shadowed by the smaller instgen/setup.exe match. (2)
# the step now ALWAYS logs a full recursive listing of every .exe under
# obj-*\dist and obj-*\comm\mail\installer, sorted largest-first, win or
# lose - not just when nothing matches - so if the true full installer still
# isn't found by the candidate patterns, we get hard evidence of its real
# path and size instead of another guess. Not yet a confirmed fix for the
# payload bug itself - if no larger installer turns up anywhere in that
# listing, the next suspect is the mozconfig's `--disable-updater` line
# possibly suppressing the sea/ concatenation step upstream in mach package,
# which would need its own separate investigation and is not addressed by
# this change.
#
# Run 15 (2026-08-27): built from commit c7ce536. The largest-file-wins fix worked on
# the first try - found the real combined full installer at
# obj-*\dist\topdogsmail-156.0a1.en-US.win64.installer.exe (89,956,359 bytes), and the
# diagnostic listing showed dist\bin\topdogsmail.exe and dist\topdogsmail\topdogsmail.exe
# both present and correctly sized. Uploaded installer artifact: 85.7MB (up from run 14's
# 211KB). Windows Sandbox install test (Gene, same protocol as prior runs) confirmed:
# wizard clean end to end, "PRC Mail" naming correct on Setup Type and Summary pages
# (MOZ_APP_DISPLAYNAME fix from 608c7e7 confirmed working), corrected eagle image displays
# (though Gene found two small remaining cosmetic defects in wizWatermark.bmp on close
# inspection - a white gap near the eagle's feet/talons and a mismatched white/blue patch
# near the arrow's feathers, both logged in Top-Dogs-Mail-Project-Reference.md as
# still-owed, non-blocking touch-ups). The real test: installed folder was inspected
# directly and contains a genuinely complete application tree (xul.dll, omni.ja,
# topdogsmail.exe, chrome/, defaults/, fonts/, isp/, VisualElements/, uninstall/ - not just
# 2 DLLs like run 13). This is the first run to actually produce a real, complete install.
#
# But launching topdogsmail.exe (via the Finish page's "Launch now" checkbox) failed with
# a genuine Windows loader error: "The code execution cannot proceed because MSVCP140.dll
# was not found." Confirmed by direct inspection that msvcp140.dll, vcruntime140.dll, and
# vcruntime140_1.dll are all absent from the installed folder. Confirmed via full-text
# search of run 14's complete build log that these DLL names and the word "redist" never
# appear anywhere in the build output - the copy step that should bundle them apparently
# never runs (or never logs anything) in this build configuration. Per Mozilla's own
# Bugzilla history (bug 1624546), these DLLs are normally copied from the vendored MSVC
# toolchain's own VC\Redist folder during packaging, using filename patterns tied to
# specific toolset versions - our build vendors a much newer MSVC toolset (14.51.36231,
# per run 9's diagnosis) than Mozilla's hardcoded patterns may recognize. Plausible
# mechanism, not proven.
#
# Fix for run 16: rather than patching Mozilla's own packaging internals, added a new step
# ("Locate and bundle missing VC++ runtime DLLs into dist\bin") that runs after mach build
# and before mach package - it searches the vendored toolchain cache
# (%USERPROFILE%\.mozbuild) for msvcp140.dll, vcruntime140.dll, and vcruntime140_1.dll,
# logs everywhere it finds them (or a clear warning if it finds nothing, which would mean
# these DLLs aren't vendored into this environment at all and point the investigation
# elsewhere), and copies any x64 matches into dist\bin ourselves so mach package's normal
# file sweep picks them up along with everything else. Not yet confirmed whether these
# DLLs actually exist anywhere in the vendored toolchain cache for this to find - run 16
# is the test of that.
#
# Run 16 (2026-08-27): built from commit fcad34c. The new step's log confirmed the
# hoped-for result at build time - "Bundled 3 of 3 VC++ runtime DLLs into dist\bin" - all
# three DLLs were found under %USERPROFILE%\.mozbuild and copied into dist\bin before
# `mach package` ran. But the real install test (Gene, same protocol as prior runs) still
# failed to launch, and direct inspection of the installed folder found ALL THREE DLLs
# still absent - not a partial fix, the dist\bin copy made no difference to the final
# installer at all. (Two separate launch attempts reported two different missing-DLL
# names - MSVCP140.dll first, then VCRUNTIME140.dll on retry - but Gene confirmed nothing
# changed between attempts, so this is just the Windows loader reporting whichever missing
# dependency it hits first in a non-deterministic order, not evidence of a partial fix.)
#
# Root cause found (2026-08-27), via direct inspection of comm-central's actual
# mail/installer/package-manifest.in source (hg.mozilla.org), not guessing: this manifest
# is NOT a blind sweep of whatever's in dist\bin. The runtime-DLL block is an explicit,
# macro-driven entry gated behind "#if MOZ_PACKAGE_MSVC_DLLS", and the three DLL
# filenames themselves come from configure-time variables (MSVC_C_RUNTIME_DLL /
# MSVC_C_RUNTIME_1_DLL / MSVC_CXX_RUNTIME_DLL) that Mozilla's build system sets from a
# hardcoded per-MSVC-toolset-version lookup table - confirmed via Mozilla bug 569268, the
# original patch introducing this mechanism ("some defines per-VC version to pick the
# right one"). Our build vendors MSVC 14.51.36231, far newer than anything in that table,
# so MOZ_PACKAGE_MSVC_DLLS never resolves true for us and the whole block compiles out of
# package-manifest.in before packaging even starts - meaning nothing in the manifest ever
# told `mach package` to copy these files, regardless of what run 16's step put in
# dist\bin. This also explains why run 14's full build log never mentioned these DLL
# names or the word "redist" anywhere: the code path that would log that never runs for
# our toolchain version.
#
# Fix for run 17: added a new step, "Add unconditional VC++ runtime DLL entries to
# package-manifest.in", right after the identity-rename step (so it runs on the freshly
# cloned source before anything consumes the manifest) - it appends explicit, unconditional
# entries for msvcp140.dll, vcruntime140.dll, and vcruntime140_1.dll directly to
# comm/mail/installer/package-manifest.in, bypassing the version-table gate entirely.
# This is necessary but works only together with run 16's existing dist\bin copy step,
# kept as-is: that step puts the real DLL bytes in dist\bin, this new step makes the
# manifest actually reference them by name so mach package's manifest-driven copy has
# something to find. Not yet confirmed end-to-end - the real test is another install +
# launch check in Windows Sandbox once run 17 completes.
#
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Report machine specs
        run: |
          Get-CimInstance Win32_ComputerSystem | Select-Object Name, NumberOfProcessors, NumberOfLogicalProcessors, TotalPhysicalMemory
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory

      - name: Report starting disk space
        run: Get-PSDrive -PSProvider FileSystem

      - name: Confirm base prerequisites are present
        run: |
          python --version
          git --version

      - name: Install MozillaBuild (required by mach on Windows)
        run: choco install mozillabuild -y

      - name: Clone Firefox source (build platform)
        working-directory: ${{ runner.temp }}
        run: git clone --depth 1 --branch esr153 https://github.com/mozilla-firefox/firefox.git source

      - name: Clone Thunderbird source into comm/
        working-directory: ${{ runner.temp }}/source
        run: git clone --depth 1 --branch esr153 https://github.com/thunderbird/thunderbird-desktop.git comm

      - name: Copy real MAR-signing certificates into place
        run: |
          Copy-Item -Force -Path "certs/dep1.der" -Destination "${{ runner.temp }}/source/toolkit/mozapps/update/updater/dep1.der"
          Copy-Item -Force -Path "certs/dep2.der" -Destination "${{ runner.temp }}/source/toolkit/mozapps/update/updater/dep2.der"

      - name: Copy Patriot Radio Club branding into place
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/source/comm/mail/branding/patriotradioclub" | Out-Null
          Copy-Item -Recurse -Force -Path "branding/mozilla-branding/patriotradioclub/*" -Destination "${{ runner.temp }}/source/comm/mail/branding/patriotradioclub/"

      - name: Apply Top Dogs Mail app-identity rename (proven manually 2026-08-25 on the dedicated build VM)
        working-directory: ${{ runner.temp }}/source
        run: |
          function Replace-Exact($Path, $Old, $New) {
            $content = Get-Content -Path $Path -Raw
            if (-not $content.Contains($Old)) {
              Write-Error "Expected string not found in $Path - upstream source may have changed since this step was written. Looking for: $Old"
              exit 1
            }
            $content = $content.Replace($Old, $New)
            Set-Content -Path $Path -Value $content -NoNewline
          }

          Replace-Exact "comm/mail/moz.configure" 'imply_option("MOZ_APP_NAME", "thunderbird")' 'imply_option("MOZ_APP_NAME", "topdogsmail")'
          Replace-Exact "comm/mail/moz.configure" 'imply_option("MOZ_APP_BASENAME", "Thunderbird")' 'imply_option("MOZ_APP_BASENAME", "Top Dogs Mail")'
          Replace-Exact "comm/mail/moz.configure" 'imply_option("MOZ_APP_ID", "{3550f703-e582-4d05-9a08-453d09bdfdc6}")' 'imply_option("MOZ_APP_ID", "{eec8ce29-6914-4ca8-b125-312cd6a6dee8}")'
          Replace-Exact "comm/mail/moz.configure" 'imply_option("MOZ_APP_VENDOR", "Mozilla")' 'imply_option("MOZ_APP_VENDOR", "Top Dogs Development")'
          Write-Host "moz.configure identity rename applied (MOZ_APP_PROFILE deliberately left as stock Thunderbird - preserves an existing user's profile/accounts when this replaces a real Thunderbird install)"

          $defines = "comm/mail/installer/windows/nsis/defines.nsi.in"
          Replace-Exact $defines '!define AppName               "Thunderbird"' '!define AppName               "Top Dogs Mail"'
          Replace-Exact $defines '!define WindowClass           "ThunderbirdMessageWindow"' '!define WindowClass           "TopDogsMailMessageWindow"'
          Replace-Exact $defines '!define AppRegNameMail        "Thunderbird"' '!define AppRegNameMail        "Top Dogs Mail"'
          Replace-Exact $defines '!define AppRegNameNews        "Thunderbird (News)"' '!define AppRegNameNews        "Top Dogs Mail (News)"'
          Replace-Exact $defines '!define AppRegNameCalendar    "Thunderbird (Calendar)"' '!define AppRegNameCalendar    "Top Dogs Mail (Calendar)"'
          Replace-Exact $defines '!define ClientsRegName        "Mozilla Thunderbird"' '!define ClientsRegName        "Top Dogs Mail"'
          Replace-Exact $defines '!define BrandProductName      "Thunderbird"' '!define BrandProductName      "Top Dogs Mail"'
          Write-Host "defines.nsi.in identity rename applied (CERTIFICATE_NAME/CERTIFICATE_ISSUER deliberately left as Mozilla's real signing identity, not ours to set)"

          Replace-Exact "comm/mail/installer/windows/nsis/installer.nsi" '!define AbortSurveyURL "https://live.thunderbird.net/survey/cancel/?page="' '!define AbortSurveyURL "https://topdogs.dev/patriot-radio-club/install-cancelled/?step="'
          Write-Host "installer.nsi AbortSurveyURL repointed to our own site"

      - name: Add unconditional VC++ runtime DLL entries to package-manifest.in
        working-directory: ${{ runner.temp }}/source
        run: |
          # Root cause found 2026-08-27 (see run 16/17 history comment near the top of this
          # file for the full evidence trail). Short version: package-manifest.in's own
          # runtime-DLL block is gated behind "#if MOZ_PACKAGE_MSVC_DLLS", which Mozilla's
          # build system only sets true for MSVC toolset versions in its own hardcoded
          # lookup table (Mozilla bug 569268) - our vendored 14.51.36231 isn't in it, so the
          # block compiles out and package-manifest.in never references these files at all
          # for our build, regardless of what the "Locate and bundle..." step (below, later
          # in this workflow) puts in dist\bin. This step appends our own unconditional
          # entries so mach package's manifest-driven copy has something to find. Confirmed
          # via direct inspection of comm-central's actual package-manifest.in
          # (hg.mozilla.org, 2026-08-27) that the file ends with a plain top-level line, not
          # an open conditional - so an append is safe here.
          $manifest = "comm/mail/installer/package-manifest.in"
          $marker = "; Top Dogs Mail: unconditional VC++ runtime DLLs (run 17 fix - see workflow history comment for why)"
          $content = Get-Content -Path $manifest -Raw
          if ($content.Contains($marker)) {
            Write-Host "package-manifest.in already has the unconditional VC++ runtime DLL block - skipping"
          } else {
            $lines = @(
              "",
              $marker,
              "#ifdef XP_WIN",
              "@BINPATH@/msvcp140.dll",
              "@BINPATH@/vcruntime140.dll",
              "@BINPATH@/vcruntime140_1.dll",
              "#endif"
            )
            Add-Content -Path $manifest -Value $lines
            Write-Host "Appended unconditional msvcp140.dll / vcruntime140.dll / vcruntime140_1.dll entries to $manifest"
          }

      - name: Apply Account Hub UI patches (remove Thundermail sign-in button, repoint Donate/Privacy Policy links, repoint Account Central donation banner, embed header logo, fix Support link default, fix Support footer link, disable Release Notes link, fix first-run Privacy Notice link)
        working-directory: ${{ runner.temp }}/source
        run: |
          function Replace-Exact($Path, $Old, $New) {
            # Normalize line endings before comparing: run 19 failed on the first
            # multi-line here-string match here (single-line matches in the
            # app-identity-rename step above were unaffected) even though the
            # source text was confirmed byte-identical outside the runner -
            # thunderbird-desktop's .gitattributes forces "* -text" (pure LF,
            # no normalization), so a CRLF introduced anywhere between this
            # workflow file and the generated step script breaks an exact
            # multi-line match. Normalizing both sides to LF makes the
            # comparison robust regardless of where that CRLF was introduced.
            $content = (Get-Content -Path $Path -Raw) -replace "`r`n", "`n" -replace "`r", "`n"
            $OldNorm = ($Old -replace "`r`n", "`n") -replace "`r", "`n"
            if (-not $content.Contains($OldNorm)) {
              Write-Error "Expected string not found in $Path - upstream source may have changed since this step was written. Looking for: $OldNorm"
              exit 1
            }
            $NewNorm = ($New -replace "`r`n", "`n") -replace "`r", "`n"
            $content = $content.Replace($OldNorm, $NewNorm)
            Set-Content -Path $Path -Value $content -NoNewline
          }

          $template = "comm/mail/components/accountcreation/templates/accountHubEmailAutoFormTemplate.inc.xhtml"
          $thundermailBlock = @'
            <div class="account-hub-thundermail-header" slot="middle-content">
              <button class="account-hub-thundermail-button" type="button">
                <img class="account-hub-thundermail-icon" src="" alt="" />
                <span data-l10n-id="account-hub-thundermail-button"></span>
              </button>
              <div class="account-hub-thundermail-divider">
                <span
                  class="account-hub-thundermail-divider-text"
                  data-l10n-id="account-hub-thundermail-divider-text"
                ></span>
              </div>
            </div>
          '@
          Replace-Exact $template $thundermailBlock ""
          Write-Host "Removed Sign in with Thundermail button from account hub email setup template"

          $footer = "comm/mail/components/accountcreation/templates/accountHubFooterTemplate.inc.xhtml"
          Replace-Exact $footer 'href="https://www.thunderbird.net/donate/?utm_source=thunderbird_account_hub&amp;utm_medium=referral&amp;utm_content=hub_footer"' 'href="https://checkout.square.site/merchant/ML51RES27MWK5/checkout/NI2625HDAZNMQEF3WNOW772K"'
          Write-Host "Repointed Donate footer link to Top Dogs Development Square checkout"

          Replace-Exact $footer 'href="https://www.thunderbird.net/privacy/"' 'href="https://topdogs.dev/?page_id=46"'
          Write-Host "Repointed Account Hub footer Privacy Policy link to Top Dogs Mail privacy policy page"

          Replace-Exact $footer 'href="https://support.mozilla.org/products/thunderbird"' 'href="https://topdogs.dev/?page_id=48"'
          Write-Host "Repointed Support footer link to Top Dogs Mail support page - ESR153 hardcodes this directly in the template with no JS/pref wiring at all (confirmed via real ESR153 source, 2026-09-01), unlike the app.support.baseURL pref patch below which an earlier pre-ESR153 account-hub-footer.mjs used to read at runtime"

          $acctCentral = "comm/mailnews/base/content/msgAccountCentral.xhtml"
          Replace-Exact $acctCentral 'href="https://www.thunderbird.net/donate/?utm_source=account_hub_tb_release&amp;utm_medium=referral&amp;utm_content=paragraph_text"' 'href="https://checkout.square.site/merchant/ML51RES27MWK5/checkout/NI2625HDAZNMQEF3WNOW772K"'
          Write-Host "Repointed Account Central donation banner link to Top Dogs Development Square checkout"

          # Root cause found 2026-08-30 via live Browser Console testing on a real install:
          # EVERY chrome://branding/content/* resource (logo-gradient.svg, about-logo.png,
          # aboutDialog.css, about-wordmark.svg) fails with "No chrome package registered
          # for chrome://branding/content/...". Our custom --with-branding directory's own
          # content jar.mn and pref/thunderbird-branding.js are both silently never
          # registered at runtime, despite building without error and despite Mozilla's own
          # build docs confirming --with-branding is "intentionally undocumented" (unofficial,
          # unsupported territory). Rather than keep fighting that mechanism, both fixes below
          # bypass it entirely using the same direct-source-patch pattern already proven
          # reliable elsewhere in this file (moz.configure identity rename, etc).
          $accountHubHeader = "comm/mail/components/accountcreation/templates/accountHubHeaderTemplate.inc.xhtml"
          Replace-Exact $accountHubHeader 'src="chrome://branding/content/logo-gradient.svg"' 'src="data:image/svg+xml;base64,"'
          Write-Host "Embedded Top Dogs Mail TD-monogram logo directly into the Account Hub header template as a data URI - no external chrome:// resource to fail to register"

          $corePrefs = "comm/mail/app/profile/all-thunderbird.js"
          Replace-Exact $corePrefs 'pref("app.support.baseURL", "https://support.thunderbird.net/%APP%/%VERSION%/%OS%/%LOCALE%/");' 'pref("app.support.baseURL", "https://topdogs.dev/?page_id=48");'
          Write-Host "Repointed Support link default directly in Thunderbird's core prefs file (all-thunderbird.js) - bypasses our branding-specific prefs file, which never loads for the same chrome-package-registration reason"

          Replace-Exact $corePrefs 'pref("app.releaseNotesURL", "https://live.thunderbird.net/%APP%/releasenotes?locale=%LOCALE%&version=%VERSION%&channel=%CHANNEL%&os=%OS%&buildid=%APPBUILDID%");' 'pref("app.releaseNotesURL", "https://updates.topdogs.dev/mail/patriot-radio-club/release-notes.html");'
          Write-Host "Repointed Release Notes footer link to the real, auto-generated release-notes page (updates.topdogs.dev) - previously disabled (about:blank) since there was no page to send it to; account-hub-footer.mjs shows the link whenever this pref isn't exactly about:blank"

          Replace-Exact $corePrefs 'pref("datareporting.policy.firstRunURL", "https://www.mozilla.org/thunderbird/legal/privacy/");' 'pref("datareporting.policy.firstRunURL", "https://topdogs.dev/?page_id=46");'
          Write-Host "Repointed the first-run Privacy Notice tab (Bug 2, open and unlocated since 2026-08-25) to the Top Dogs Mail privacy policy page"

          # Real update-check URL, found 2026-09-02: app.update.url is NOT a pref
          # anymore (removed from all-thunderbird.js in upstream Bug 1568994/1630041,
          # confirmed by its absence and the explicit "app.update.url was removed in
          # Bug 1630041" comment in the real ESR153 all-thunderbird.js). The updater
          # (toolkit/mozapps/update/UpdateService.sys.mjs) reads Services.appinfo.updateURL
          # instead, which XRE populates from application.ini's own [AppUpdate] URL line -
          # a build-time template at build/application.ini.in in the PLATFORM repo (not
          # comm/), confirmed via real ESR153 source. Its default host comes from
          # mail/moz.configure's `set_config("MOZ_APPUPDATE_HOST", "aus.thunderbird.net")`,
          # but that only swaps the hostname - the template still appends Balrog-style
          # dynamic path segments (%PRODUCT%/%VERSION%/%BUILD_ID%/.../%SYSTEM_CAPABILITIES%/...)
          # that our static nginx file server on iffweb01 has no routing for. So this patches
          # the whole URL line, not just the host, to our real flat static path.
          $appUpdateIni = "build/application.ini.in"
          Replace-Exact $appUpdateIni 'URL=https://@MOZ_APPUPDATE_HOST@/update/6/%PRODUCT%/%VERSION%/%BUILD_ID%/%BUILD_TARGET%/%LOCALE%/%CHANNEL%/%OS_VERSION%/%SYSTEM_CAPABILITIES%/%DISTRIBUTION%/%DISTRIBUTION_VERSION%/update.xml' 'URL=https://updates.topdogs.dev/mail/patriot-radio-club/update.xml'
          Write-Host "Repointed the real update-check URL (application.ini's [AppUpdate] URL) to our own static update-file-serving endpoint - this is the actual mechanism Services.appinfo.updateURL reads, bypassing the removed app.update.url pref entirely"

      - name: Apply mandatory update-gate patch (fetch min-version.json on every launch, soft-nag notification if below minimum, fails open on any error)
        working-directory: ${{ runner.temp }}/source
        run: |
          function Replace-Exact($Path, $Old, $New) {
            $content = (Get-Content -Path $Path -Raw) -replace "`r`n", "`n" -replace "`r", "`n"
            $OldNorm = ($Old -replace "`r`n", "`n") -replace "`r", "`n"
            if (-not $content.Contains($OldNorm)) {
              Write-Error "Expected string not found in $Path - upstream source may have changed since this step was written. Looking for: $OldNorm"
              exit 1
            }
            $NewNorm = ($New -replace "`r`n", "`n") -replace "`r", "`n"
            $content = $content.Replace($OldNorm, $NewNorm)
            Set-Content -Path $Path -Value $content -NoNewline
          }

          $msgJs = "comm/mail/base/content/messenger.js"
          $gateOld = @'
                Services.obs.notifyObservers(window, "extensions-late-startup");
              });
            },
          '@
          $gateNew = @'
                Services.obs.notifyObservers(window, "extensions-late-startup");
              });

              // Mandatory update gate (Top Dogs Mail, added 2026-09-03). Fire-and-forget:
              // never awaited, never blocks startup. Any failure (offline, unreachable
              // server, malformed response) fails open -- the member just doesn't see the
              // nag this launch, per standing decision.
              (async () => {
                try {
                  const resp = await fetch(
                    "https://updates.topdogs.dev/mail/patriot-radio-club/min-version.json",
                    { cache: "no-store" }
                  );
                  if (!resp.ok) {
                    return;
                  }
                  const data = await resp.json();
                  const minVersion = data && data.minVersion;
                  if (!minVersion) {
                    return;
                  }
                  if (Services.vc.compare(Services.appinfo.version, minVersion) >= 0) {
                    return;
                  }
                  const about3Pane = document.getElementById("tabmail")?.currentAbout3Pane;
                  const box = about3Pane?.notificationBox;
                  if (!box) {
                    return;
                  }
                  box.appendNotification(
                    "topdogsmail-update-required",
                    {
                      label:
                        "A required update to Top Dogs Mail Client is available. Please update as soon as possible.",
                      priority: box.PRIORITY_WARNING_HIGH,
                    },
                    [
                      {
                        label: "Update Now",
                        callback: () => {
                          openAboutDialog();
                          return false;
                        },
                      },
                    ]
                  );
                } catch (ex) {
                  console.error("Top Dogs Mail update-gate check failed", ex);
                }
              })();
            },
          '@
          Replace-Exact $msgJs $gateOld $gateNew
          Write-Host "Applied mandatory update-gate patch to gMailInit._delayedStartup() in messenger.js"

      - name: Bootstrap build environment
        working-directory: ${{ runner.temp }}/source
        run: python mach --no-interactive bootstrap --application-choice="Firefox for Desktop"

      - name: Write mozconfig for Thunderbird (comm/mail) with Patriot Radio Club branding
        working-directory: ${{ runner.temp }}/source
        run: |
          Set-Content -Path mozconfig -Value 'ac_add_options --enable-project=comm/mail'
          Add-Content -Path mozconfig -Value 'ac_add_options --with-branding=comm/mail/branding/patriotradioclub'
          Add-Content -Path mozconfig -Value 'mk_add_options MOZ_MAKE_FLAGS="--output-sync=target"'
          Add-Content -Path mozconfig -Value 'ac_add_options --enable-update-channel=topdogsmail-release'
          Add-Content -Path mozconfig -Value 'export MAR_CHANNEL_ID=topdogsmail-patriotradioclub-release'
          Add-Content -Path mozconfig -Value 'export ACCEPTED_MAR_CHANNEL_IDS=topdogsmail-patriotradioclub-release'

      - name: Vendor Rust dependencies
        working-directory: ${{ runner.temp }}/source
        run: python mach tb-rust vendor

      - name: Report disk space before build
        run: Get-PSDrive -PSProvider FileSystem

      - name: Build (mach build) with memory monitoring
        working-directory: ${{ runner.temp }}/source
        run: |
          $buildStartTime = Get-Date
          Set-Content -Path "$env:RUNNER_TEMP\build-start-time.txt" -Value $buildStartTime.ToString("o")

          $memLog = "$env:RUNNER_TEMP\mem-monitor.log"
          $job = Start-Job -ScriptBlock {
            param($logPath)
            while ($true) {
              $os = Get-CimInstance Win32_OperatingSystem
              $freeMB = [math]::Round($os.FreePhysicalMemory / 1024, 0)
              $totalMB = [math]::Round($os.TotalVisibleMemorySize / 1024, 0)
              $line = "{0} FreeMB={1} TotalMB={2}" -f (Get-Date -Format "HH:mm:ss"), $freeMB, $totalMB
              Add-Content -Path $logPath -Value $line
              Start-Sleep -Seconds 10
            }
          } -ArgumentList $memLog

          & cmd /c 'python mach build -v > "%RUNNER_TEMP%\mach-build-full.log" 2>&1'
          $buildExitCode = $LASTEXITCODE

          Stop-Job -Job $job -ErrorAction SilentlyContinue
          Receive-Job -Job $job -ErrorAction SilentlyContinue | Out-Null
          Remove-Job -Job $job -ErrorAction SilentlyContinue

          Write-Host "----- Last 40 memory samples (most recent last) -----"
          if (Test-Path $memLog) {
            Get-Content $memLog -Tail 40
          } else {
            Write-Host "No memory monitor log found at $memLog"
          }

          if ($buildExitCode -ne 0) {
            Write-Host "mach build failed with exit code $buildExitCode"
            exit $buildExitCode
          }

      - name: Show tail of build log
        if: always()
        run: |
          $log = "${{ runner.temp }}\mach-build-full.log"
          if (Test-Path $log) {
            Write-Host "----- Last 200 lines of mach build log -----"
            Get-Content $log -Tail 200
          } else {
            Write-Host "No build log found at $log"
          }

      - name: Check Windows Error Reporting for crash events
        if: always()
        run: |
          $werLog = "$env:RUNNER_TEMP\wer-events.log"
          $startTimeFile = "$env:RUNNER_TEMP\build-start-time.txt"
          if (Test-Path $startTimeFile) {
            $startTime = [DateTime]::Parse((Get-Content $startTimeFile))
          } else {
            Write-Host "No build-start-time.txt found, defaulting to 4 hours ago"
            $startTime = (Get-Date).AddHours(-4)
          }

          Write-Host "Checking Application event log for Event ID 1000/1001 since $startTime"
          $events = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=$startTime} -ErrorAction SilentlyContinue

          if ($events) {
            Write-Host "----- Found $($events.Count) WER/crash event(s) -----"
            $events | Format-List | Out-File -FilePath $werLog -Encoding UTF8
            Get-Content $werLog
          } else {
            Write-Host "No Event ID 1000/1001 entries found in the Application log since build start."
            Set-Content -Path $werLog -Value "No Event ID 1000/1001 entries found in the Application log since $startTime."
          }

      - name: Upload full build log and memory monitor log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-dogs-mail-patriotradioclub-windows-build-log
          path: |
            ${{ runner.temp }}/mach-build-full.log
            ${{ runner.temp }}/mem-monitor.log
            ${{ runner.temp }}/wer-events.log
          retention-days: 14

      - name: Locate and bundle missing VC++ runtime DLLs into dist\bin
        working-directory: ${{ runner.temp }}/source
        run: |
          # Run 15 finding (2026-08-27): run 15's installer (the real ~86-90MB combined
          # full installer, correctly located this time thanks to the largest-file-wins
          # fix above) installed a genuinely complete application tree in Windows Sandbox -
          # xul.dll, omni.ja, topdogsmail.exe, all present and correctly sized. But
          # launching topdogsmail.exe failed with a real Windows loader error: "The code
          # execution cannot proceed because MSVCP140.dll was not found." Confirmed by
          # directly inspecting the installed folder that msvcp140.dll, vcruntime140.dll,
          # and vcruntime140_1.dll are ALL absent - and confirmed via a full-text search of
          # run 14's complete mach-build-full.log that these DLL names and the word
          # "redist" never appear anywhere in the build output at all. Per Mozilla's own
          # Bugzilla history (bug 1624546, "Include vcruntime140_1.dll... from the redist
          # directory in the package"), Firefox/Thunderbird's official build normally
          # copies these DLLs from the vendored MSVC toolchain's own VC\Redist folder into
          # dist\bin as a packaging step, using filename patterns tied to specific
          # toolset versions. Our build vendors a very new MSVC toolset (14.51.36231, per
          # run 9's diagnosis) that Mozilla's hardcoded copy patterns may not have been
          # updated to recognize - a plausible mechanism, not yet proven, for why the copy
          # never happens (silently) in our build. Rather than trying to patch Mozilla's
          # own internal packaging logic to recognize a newer toolset, this step works
          # around it in our own workflow: search the vendored toolchain's own cache for
          # these exact DLLs and copy any x64 matches into dist\bin ourselves, BEFORE
          # `mach package` runs, so they get swept into the installer the normal way along
          # with everything else already in dist\bin. This also serves as a diagnostic in
          # its own right: if the search below finds nothing, the DLLs may not be vendored
          # into this build environment at all, which would point the investigation
          # somewhere else entirely (e.g. explicitly vendoring the VC++ Redistributable via
          # a separate install step) rather than a simple copy fix.
          Write-Host "--- Searching vendored MSVC toolchain cache for VC++ runtime DLLs ---"
          $dllNames = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          $found = Get-ChildItem -Path "$env:USERPROFILE\.mozbuild" -Recurse -Include $dllNames -ErrorAction SilentlyContinue
          if ($found) {
            $found | ForEach-Object { Write-Host "$($_.Length) bytes  $($_.FullName)" }
          } else {
            Write-Warning "No matches for msvcp140.dll / vcruntime140.dll / vcruntime140_1.dll found anywhere under $env:USERPROFILE\.mozbuild - these DLLs may not be vendored into this build environment at all."
          }

          $distBin = Get-ChildItem -Path "obj-*\dist\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $distBin) {
            Write-Error "Could not find obj-*\dist\bin - build output layout may have changed. Skipping DLL bundling."
            exit 0
          }
          Write-Host "--- Copying any x64 matches into $($distBin.FullName) ---"
          $copied = @()
          foreach ($name in $dllNames) {
            $candidate = $found | Where-Object { $_.Name -eq $name -and $_.FullName -match "\\x64\\" } | Select-Object -First 1
            if (-not $candidate) {
              $candidate = $found | Where-Object { $_.Name -eq $name } | Select-Object -First 1
            }
            if ($candidate) {
              Copy-Item -Path $candidate.FullName -Destination (Join-Path $distBin.FullName $name) -Force
              Write-Host "Copied $name from $($candidate.FullName)"
              $copied += $name
            } else {
              Write-Warning "$name not found anywhere under $env:USERPROFILE\.mozbuild - dist\bin will still be missing it."
            }
          }
          Write-Host "--- Bundled $($copied.Count) of $($dllNames.Count) VC++ runtime DLLs into dist\bin ---"

      - name: Package installer (mach package)
        working-directory: ${{ runner.temp }}/source
        run: python mach package

      - name: Locate packaged installer
        id: find_installer
        working-directory: ${{ runner.temp }}/source
        run: |
          # Run 12 diagnosis (2026-08-25): the naive fallback here previously grabbed
          # obj-*\dist\bin\uninstall\helper.exe (the NSIS *uninstaller*, always built as a
          # normal side effect of `mach build`, unrelated to packaging) because it was simply
          # the first *.exe found under dist. Confirmed via the actual "Package installer"
          # step log for run #12 that `mach package` produced the real installer at
          # comm/mail/installer/windows/instgen/setup.exe (an NSIS-built installer, ~739KB -
          # this run's mozilla-central/comm-central snapshot produced this size; earlier this
          # same night, the dedicated build VM's snapshot instead produced a much larger
          # (~90MB) installer directly under dist\ - the two are not guaranteed to match since
          # this workflow always builds from today's latest upstream source, not a pinned
          # revision). Check known-good locations by name first.
          #
          # Run 14 diagnosis (2026-08-27): this step was still finding and uploading the
          # small instgen/setup.exe (~757KB) every run, because the original loop `break`s
          # on the FIRST pattern with any match at all - it never even checked the third
          # pattern (obj-*\dist\*.exe) once the second pattern matched, even though that
          # third pattern might catch a genuine full installer under a name/location the
          # first two patterns miss. Per Mozilla's own installer build docs, the small
          # instgen/setup.exe is only ever the NSIS front-end shell; the real full/complete
          # installer is a separate ~80-90MB file produced by concatenating a UPX-packed SFX
          # module with the packaged application payload, normally expected under
          # obj-*\dist\install\sea\*.exe (our first, and so far always-empty, pattern).
          # Changed this step to (a) collect matches across ALL three patterns instead of
          # stopping at the first pattern with any match, and pick the LARGEST file found
          # rather than assuming pattern order reflects correctness, and (b) always print a
          # full recursive listing of every .exe under obj-*\dist and obj-*\comm\mail\installer,
          # sorted largest-first, whether or not a candidate pattern matched - so if the real
          # full installer still isn't caught by these patterns, we get hard evidence of its
          # actual size and path instead of another guess.
          $candidates = @(
            "obj-*\dist\install\sea\*.exe",
            "obj-*\comm\mail\installer\windows\instgen\setup.exe",
            "obj-*\dist\*.exe"
          )
          $allMatches = foreach ($pattern in $candidates) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue
          }
          Write-Host "--- Candidates found across known-good patterns (largest first) ---"
          $allMatches | Sort-Object Length -Descending | ForEach-Object { Write-Host "$($_.Length) bytes  $($_.FullName)" }

          Write-Host "--- Full diagnostic listing: every .exe under obj-*\dist and obj-*\comm\mail\installer (largest first, always run) ---"
          Get-ChildItem -Recurse -Path obj-*\dist,obj-*\comm\mail\installer -Filter *.exe -ErrorAction SilentlyContinue | Sort-Object Length -Descending | ForEach-Object { Write-Host "$($_.Length) bytes  $($_.FullName)" }

          $installer = $allMatches | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found via known-good patterns - packaging step likely did not produce the expected output, or produced it somewhere new. Check the diagnostic listing above and the 'Package installer' step log."
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName) ($($installer.Length) bytes)"
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: top-dogs-mail-patriotradioclub-windows-installer
          path: ${{ steps.find_installer.outputs.installer_path }}
          retention-days: 14
